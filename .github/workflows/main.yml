name: Deploy to neocities

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *' # Automatically updates your music widget every 15 minutes!
  workflow_dispatch: # Adds a button in GitHub to run this manually anytime

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Node.js environment to run your script
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Run your script to generate the music-data.json file
      - name: Fetch Last.fm Now Playing
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: 'YOUR_LASTFM_USERNAME' # <-- Put your real Last.fm username here
        run: |
          npm init -y
          npm install node-fetch
          node update-widget.js

      # 3. Your original Neocities step (Uploads everything, including the new music-data.json)
      - name: Deploy to neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: false
          neocities_supporter: false
          preview_before_deploy: true
          dist_dir: .
