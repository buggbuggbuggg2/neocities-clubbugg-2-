<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drawing room</title>
    <script src="https://u.widget.st/ar.js"></script>
    <style>

.parent {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 8px;
}
    
.div1 {
    grid-column: span 4 / span 4;
    grid-column-start: 2;
    grid-row-start: 2;
    background: #ffa8d6;
}

.div2 {
    grid-column: span 4 / span 4;
    grid-row: span 5 / span 5;
    grid-column-start: 2;
    grid-row-start: 3;
    background: lightpink;
}
        
    </style>
</head>

<body>
    
    <div class="parent">
        <div class="div1"><h1>drawing board</h1></div>
            <div class="div2">
                <h1> this is broken for me bc my wifi blocks nekoweb. so yeah im not doing the crazy workaround to fix it </h1>
            <iframe src="https://mintycake.nekoweb.org/draw" width="600" height="500" style="border: 1px solid #ccc;"
                title="Drawing Tool" loading="lazy">
            </iframe>
        </div>
    </div>
</body>

</html>
